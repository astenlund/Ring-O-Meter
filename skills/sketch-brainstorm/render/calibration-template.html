<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @page { size: 1620px 2160px; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1620px; height: 2160px; background: #ffffff; }
  .page { position: relative; width: 1620px; height: 2160px; overflow: hidden; }
  .dot {
    position: absolute;
    width: 50px;
    height: 50px;
    margin-left: -25px;
    margin-top: -25px;
  }
  .dot svg { display: block; width: 50px; height: 50px; }
  .instruction {
    position: absolute;
    top: 1600px;
    left: 0;
    width: 1620px;
    text-align: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 32px;
    color: #444;
  }
</style>
</head>
<body>
<div class="page">
  <!-- Four corner dots (150 px margin from each page edge) + one
       sanity-center dot. Each dot is a 24 px-radius circle (2 px
       stroke, white fill) with a 12-px-per-arm black cross (1 px
       stroke). Anchors use top-left offset, so the dot's actual
       *center* lands at the coordinates listed (margin offsets
       shift the SVG so center, not top-left corner, sits at
       left/top). -->
  <div class="dot" style="left: 150px; top: 150px;">
    <svg viewBox="-25 -25 50 50" xmlns="http://www.w3.org/2000/svg">
      <circle cx="0" cy="0" r="24" fill="#ffffff" stroke="#000000" stroke-width="2"/>
      <line x1="-12" y1="0" x2="12" y2="0" stroke="#000000" stroke-width="1"/>
      <line x1="0" y1="-12" x2="0" y2="12" stroke="#000000" stroke-width="1"/>
    </svg>
  </div>
  <div class="dot" style="left: 1470px; top: 150px;">
    <svg viewBox="-25 -25 50 50" xmlns="http://www.w3.org/2000/svg">
      <circle cx="0" cy="0" r="24" fill="#ffffff" stroke="#000000" stroke-width="2"/>
      <line x1="-12" y1="0" x2="12" y2="0" stroke="#000000" stroke-width="1"/>
      <line x1="0" y1="-12" x2="0" y2="12" stroke="#000000" stroke-width="1"/>
    </svg>
  </div>
  <div class="dot" style="left: 150px; top: 2010px;">
    <svg viewBox="-25 -25 50 50" xmlns="http://www.w3.org/2000/svg">
      <circle cx="0" cy="0" r="24" fill="#ffffff" stroke="#000000" stroke-width="2"/>
      <line x1="-12" y1="0" x2="12" y2="0" stroke="#000000" stroke-width="1"/>
      <line x1="0" y1="-12" x2="0" y2="12" stroke="#000000" stroke-width="1"/>
    </svg>
  </div>
  <div class="dot" style="left: 1470px; top: 2010px;">
    <svg viewBox="-25 -25 50 50" xmlns="http://www.w3.org/2000/svg">
      <circle cx="0" cy="0" r="24" fill="#ffffff" stroke="#000000" stroke-width="2"/>
      <line x1="-12" y1="0" x2="12" y2="0" stroke="#000000" stroke-width="1"/>
      <line x1="0" y1="-12" x2="0" y2="12" stroke="#000000" stroke-width="1"/>
    </svg>
  </div>
  <div class="dot" style="left: 810px; top: 1080px;">
    <svg viewBox="-25 -25 50 50" xmlns="http://www.w3.org/2000/svg">
      <circle cx="0" cy="0" r="24" fill="#ffffff" stroke="#000000" stroke-width="2"/>
      <line x1="-12" y1="0" x2="12" y2="0" stroke="#000000" stroke-width="1"/>
      <line x1="0" y1="-12" x2="0" y2="12" stroke="#000000" stroke-width="1"/>
    </svg>
  </div>
  <div class="instruction">Mark each dot. Back out to the file picker when done.</div>
</div>
</body>
</html>
